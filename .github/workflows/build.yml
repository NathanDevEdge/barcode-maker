name: Build
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install python-barcode pillow "qrcode[pil]" pyinstaller
      - run: pyinstaller --noconfirm --windowed --collect-data barcode --name LabelMakerGUI label_maker_gui.py
      - name: Windows installer
        if: runner.os == 'Windows'
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\windows.iss
      - name: macOS installer
        if: runner.os == 'macOS'
        run: ./installer/build_mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: YellowLabelMaker-${{ matrix.os }}
          path: installer_out/*
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer_out/*
          generate_release_notes: true
