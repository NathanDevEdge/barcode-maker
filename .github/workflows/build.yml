name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install python-barcode pillow pyinstaller
      - run: pyinstaller --onefile --name BarcodeMaker barcode_maker.py
      - uses: actions/upload-artifact@v4
        with: { name: BarcodeMaker-${{ matrix.os }}, path: dist/* }
